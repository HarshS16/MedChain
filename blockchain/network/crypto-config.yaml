# Hyperledger Fabric Crypto Material Configuration
# Generates certificates for 2 hospital orgs + orderer

OrdererOrgs:
  - Name: Orderer
    Domain: orderer.medchain.com
    EnableNodeOUs: true
    Specs:
      - Hostname: orderer
        SANS:
          - localhost
          - 127.0.0.1

PeerOrgs:
  - Name: HospitalA
    Domain: hospitala.medchain.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1

  - Name: HospitalB
    Domain: hospitalb.medchain.com
    EnableNodeOUs: true
    Template:
      Count: 2
      SANS:
        - localhost
        - 127.0.0.1
    Users:
      Count: 1
